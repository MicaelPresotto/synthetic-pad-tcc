[project]
name = "synthetic-pad"
version = "0.1.0"
description = "Synthetic presentation attack generation and evaluation for face liveness detection (UFSC TCC)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Micael Presotto", email = "micael@mvst.co" }]
keywords = ["biometrics", "face-anti-spoofing", "presentation-attack-detection", "synthetic-data"]

dependencies = [
    "numpy>=2.0",
    "opencv-python>=4.10",
    "pillow>=10.0",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pre-commit>=4.0",
]

[project.urls]
Repository = "https://github.com/MicaelPresotto/synthetic-pad-tcc"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synthetic_pad"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "SIM",      # flake8-simplify
    "ARG",      # unused arguments
    "PTH",      # prefer pathlib
    "RUF",      # ruff-specific
    "S",        # flake8-bandit (Python SAST, no separate tool needed)
    "NPY",      # numpy-specific rules
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # asserts are the point in tests

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "scripts"]
strict = true
warn_unreachable = true
disallow_untyped_defs = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = ["cv2.*", "matplotlib.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/synthetic_pad"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if TYPE_CHECKING:"]
